services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: gestion_university_app
    restart: unless-stopped
    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:8.4

    container_name: gestion_university_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

 
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: